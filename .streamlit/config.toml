# Configuração do Streamlit: identidade visual do app (laranja e creme).
# O tema também pode ser trocado pelo menu ⋮ → Settings → Choose app theme.

[theme]
paddingTop = "0.5rem"     # espaço abaixo da barra do topo (valor entre aspas)
font = "sans serif"       # "sans serif", "serif" ou "monospace"

[theme.light]
primaryColor = "#F26B0F"              # cor de destaque (widgets, links)
backgroundColor = "#FFF7EC"           # fundo da página
secondaryBackgroundColor = "#FDE6CC"  # fundo da sidebar e de widgets
textColor = "#3A3A3A"                 # cor do texto
borderColor = "#F0D2B0"
# Cores dos gráficos (valem para o Plotly dos dois dashboards)
chartCategoricalColors = ["#F26B0F", "#2A6F97", "#E0A100", "#5B8E3E", "#8E5BA8"]
chartSequentialColors = ["#FFF1E0", "#FDDDB8", "#FBC48A", "#F9A860", "#F68B3A", "#F26B0F", "#D55A0A", "#B04A08", "#8A3A06", "#662A04"]

[theme.dark]
primaryColor = "#F26B0F"
backgroundColor = "#1F1813"
secondaryBackgroundColor = "#2E241C"
textColor = "#FFF3E6"
borderColor = "#4A3A2C"
chartCategoricalColors = ["#F26B0F", "#5FA8D3", "#F2C14E", "#8BC06A", "#B98AD1"]
chartSequentialColors = ["#3B2414", "#53301A", "#6E3C1C", "#8C4A1B", "#AD5A18", "#D0680F", "#F26B0F", "#F58B3D", "#F9AE72", "#FDD3AC"]